name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export web data (if local CSV + model exist)
        run: |
          python -m pip install -q pandas nba_api scikit-learn numpy
          if [ -f data/games.csv ] && [ -f artifacts/baseline_logreg.pkl ]; then
            python scripts/export_web_data.py
          elif [ ! -f web/public/data/games.json ]; then
            echo "No training data and no committed web/public/data/*.json"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and build React app
        working-directory: web
        env:
          VITE_BASE_PATH: /nba-win-baseline/
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
