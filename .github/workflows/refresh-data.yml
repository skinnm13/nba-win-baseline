name: Refresh NBA Data

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch training data and train model
        run: |
          python -m pip install -q pandas nba_api scikit-learn numpy
          python scripts/fetch_data.py
          python scripts/train.py

      - name: Export web data
        run: |
          python -m pip install -q pandas nba_api scikit-learn numpy
          python scripts/export_web_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/
          git diff --cached --quiet || git commit -m "chore: refresh NBA data [skip ci]"
          git push
